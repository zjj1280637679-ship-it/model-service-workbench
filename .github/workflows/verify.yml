name: Verify source and knowledge

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-and-knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install CPU test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements-test.txt
      - name: Validate publication boundaries
        run: python tools/check_publication.py
      - name: Validate module records and source identities
        run: python tools/check_knowledge.py
      - name: Require current condition strategy and metric review
        run: python tools/check_condition_reviews.py
      - name: Validate notebook construction without starting it
        run: python tools/build_notebook.py --check-only --preload-acceleration lightx2v-ref2va-4step
      - name: Run CPU ownership and contract counterexamples
        run: python -m pytest runtime/minimax_h3 tests
      - name: Replay published research evidence without GPU
        run: python research/analyze_trace.py evidence/research-2026-11-15/trace.json
      - name: Verify bounded condition search and historical evidence
        run: python research/run_condition_study.py --output /tmp/condition-report.json
      - name: Replay runtime condition and lease evidence
        run: |
          python research/analyze_trace.py evidence/runtime-conditions-2026-11-15/trace.json
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'research')
          from analyze_condition_gates import analyze
          report = analyze(json.loads(Path('evidence/runtime-conditions-2026-11-15/trace.json').read_text()))
          unexercised = {'unknown_blocked_without_effect', 'conflict_blocked_without_effect'}
          assert report['counts']['fail'] == 0, report
          assert all(check['status'] == 'pass' for name, check in report['checks'].items() if name not in unexercised), report
          print(json.dumps(report))  # Unexercised GPU branches remain explicitly unknown.
          PY
      - name: Verify actual console delivery JavaScript
        run: node --test tests/test_console_delivery.cjs
